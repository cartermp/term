<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- macOS-style rounded square background -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="#1a1a1a"/>

  <!-- Subtle inner border -->
  <rect x="1" y="1" width="510" height="510" rx="111" ry="111" fill="none" stroke="#2e2e2e" stroke-width="2"/>

  <!-- Terminal prompt: chevron -->
  <!-- > drawn as two line segments -->
  <polyline
    points="148,196 228,256 148,316"
    fill="none"
    stroke="#5af78e"
    stroke-width="28"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Cursor block after the prompt -->
  <rect x="252" y="288" width="114" height="26" rx="4" ry="4" fill="#aeafad"/>
</svg>
