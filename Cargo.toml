[package]
name = "term"
version = "0.1.0"
edition = "2024"

default-run = "term"

[[bin]]
name = "term"
path = "src/main.rs"

[[bin]]
name = "tcat"
path = "src/bin/tcat.rs"

[dependencies]
winit = "0.30"
softbuffer = "0.4"
vte = "0.13"
portable-pty = "0.8"
fontdue = "0.8"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "parsing", "regex-fancy"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
