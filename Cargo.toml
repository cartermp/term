[package]
name = "term"
version = "1.6.0"
edition = "2024"
license = "MIT"

default-run = "term"

[[bin]]
name = "term"
path = "src/main.rs"

[[bin]]
name = "tcat"
path = "src/bin/tcat.rs"

[[bin]]
name = "tdiff"
path = "src/bin/tdiff.rs"

[[bin]]
name = "tjson"
path = "src/bin/tjson.rs"

[dependencies]
winit = "0.30"
wgpu = { version = "0.20", default-features = false, features = ["metal", "wgsl"] }
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
vte = "0.13"
portable-pty = "0.8"
fontdue = "0.8"
rustybuzz = "0.14"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "parsing", "regex-fancy"] }
serde_json = "1"
unicode-width = "0.2"
libc = "0.2"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = true
